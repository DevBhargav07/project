[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bhargav_D", email = "devarampativenkata.bhargav@invendis.com" }
]
requires-python = ">=3.8"
dependencies = [
    "aiosqlite>=0.20.0",
    "alembic>=1.14.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.124.4",
    "passlib[bcrypt]>=1.7.4",
    "pydantic[email]>=2.10.6",
    "python-dotenv>=1.0.1",
    "python-jose>=3.4.0",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.52",
    "typing-extensions>=4.13.2",
    "uvicorn[standard]>=0.33.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
